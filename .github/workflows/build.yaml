name: Build Toolbox App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Windows EXE
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller customtkinter psutil requests "qrcode[pil]" Pillow tzdata cryptography

      - name: Optional - llama-cpp-python (in-process LLM)
        shell: pwsh
        continue-on-error: true
        run: |
          pip install llama-cpp-python --only-binary=:all: --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu

      - name: Syntax check
        shell: pwsh
        run: python -m py_compile toolbox.py toolbox_api.py polybuild.py

      - name: Build with PyInstaller
        shell: pwsh
        run: |
          $args = @(
            '--noconfirm',
            '--clean',
            '--noconsole',
            '--onefile',
            '--name',
            'Toolbox',
            '--add-data',
            'plugins;plugins',
            '--add-data',
            'polybuild.py;.',
            '--hidden-import',
            'toolbox_api',
            '--hidden-import',
            'PIL._tkinter_finder',
            '--hidden-import',
            'zoneinfo',
            '--hidden-import',
            'cryptography.fernet',
            '--collect-all',
            'customtkinter',
            '--collect-data',
            'tzdata',
            '--collect-submodules',
            'qrcode'
          )

          python -c "import llama_cpp" 2>$null
          if ($LASTEXITCODE -eq 0) {
            $args += @('--collect-all', 'llama_cpp')
          }

          if (Test-Path 'icon.ico') {
            $args += @('--icon', 'icon.ico')
          }

          pyinstaller @args toolbox.py
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller failed with exit code $LASTEXITCODE" }

      - name: Verify EXE exists
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/Toolbox.exe")) { throw "dist/Toolbox.exe not found" }
          Get-Item dist/Toolbox.exe | Select-Object Name, Length

      - name: Upload Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Toolbox-Windows
          path: dist/Toolbox.exe
          if-no-files-found: error
