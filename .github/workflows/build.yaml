name: Build Toolbox App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Windows EXE
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller customtkinter psutil requests qrcode[pil] Pillow

      - name: Build with PyInstaller
        shell: pwsh
        run: |
          if (Test-Path "icon.ico") {
            pyinstaller --noconsole --onefile --name Toolbox --icon=icon.ico --add-data "plugins;plugins" --hidden-import=toolbox_api toolbox.py
          } else {
            pyinstaller --noconsole --onefile --name Toolbox --add-data "plugins;plugins" --hidden-import=toolbox_api toolbox.py
          }

      - name: Upload Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Toolbox-Windows
          path: dist/Toolbox.exe
