name: Build Toolbox App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller customtkinter psutil requests qrcode[pil] Pillow
        # Optional: Uncomment the next line if you want to bundle cryptography (for Vault)
        # pip install cryptography
        # Optional: Uncomment if you want to bundle llama-cpp-python (may fail without C++ build tools)
        # pip install llama-cpp-python

    - name: Build with PyInstaller
      run: |
        pyinstaller --noconsole --onefile --name Toolbox --icon=icon.ico --add-data "plugins;plugins" --hidden-import=toolbox_api --collect-all customtkinter toolbox.py

    - name: Upload Executable Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Toolbox-Windows
        path: dist/Toolbox.exename: Build Toolbox App

on:
  push:
    branches: [ main ]
  workflow_dispatch: # Allows you to manually trigger the build from the Actions tab

jobs:
  build:
    runs-on: windows-latest # Required for .ico and Windows executable compilation

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11' # Change this if your app requires a specific Python version

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        # If you have a requirements.txt file in your repo, uncomment the next line:
        # pip install -r requirements.txt

    - name: Build with PyInstaller
      run: |
        pyinstaller --noconsole --onefile --name Toolbox --icon=icon.ico --add-data "plugins;plugins" --hidden-import=toolbox_api toolbox.py

    - name: Upload Executable Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Toolbox-Windows
        path: dist/Toolbox.exe
